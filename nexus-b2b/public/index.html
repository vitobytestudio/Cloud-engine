<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070709" />
  <meta name="description" content="NEXUS B2B — شبكة الفرص التجارية بالفيديو العمودي. لا محتوى بلا دليل." />
  <title>NEXUS B2B — شبكة الفرص التجارية</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/IBMPlexSansArabic-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/IBMPlexSansArabic-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/design-tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <a class="brand" href="#/feed">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E5A93C"/><stop offset=".5" stop-color="#10B981"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="url(#lg)" stroke-width="2.5"/><path d="M10 22V10l12 12V10" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>NEXUS <em>B2B</em></span>
      </a>
      <div class="top-tools">
        <span id="online-pill" title=""><i></i><b id="online-n">—</b></span>
        <button id="lang-btn" class="ghost-btn" aria-label="Language">EN</button>
        <button id="me-btn" class="avatar-mini" aria-label="Profile"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav id="bottom-nav">
      <a href="#/feed" data-nav="feed"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg><span data-i18n="nav_feed"></span></a>
      <a href="#/studio" data-nav="studio"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav_studio"></span></a>
      <a href="#/chat" data-nav="chat"><svg viewBox="0 0 24 24"><path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-4.2 3.4A.8.8 0 0 1 3.5 18.8V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="nav_chat"></span></a>
      <a href="#/profile" data-nav="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="nav_profile"></span></a>
    </nav>
  </div>
  <div id="overlay-root"></div>
  <noscript><div style="padding:40px;font-family:sans-serif;color:#fff;background:#070709;text-align:center">هذا التطبيق يحتاج تفعيل JavaScript</div></noscript>
  <script type="module" src="/js/app.js"></script>
  <script>
    // إن فشل تحميل الواجهة لأي سبب — رسالة واضحة بدل شاشة فارغة
    setTimeout(function () {
      var v = document.getElementById("view");
      if (v && !v.childElementCount) {
        v.innerHTML = '<div style="min-height:60dvh;display:grid;place-items:center;color:#9a9aa6;font-family:sans-serif;text-align:center;padding:24px">جارٍ تهيئة NEXUS…<br />إن بقيت هذه الشاشة، أعد تحميل الصفحة</div>';
      }
    }, 2500);
  </script>
</body>
</html>
