name = "naksab"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
ADMIN_BOOTSTRAP_EMAIL = ""
# حساب استقبال الحوالات (بيان تجاري معلن بالتصميم — يُعرض للتاجر في صفحة الشحن ولا يُسحب منه إلا بحوالة المالك)
CCP_PAY = "00799999004159589:029"

[[d1_databases]]
binding = "DB"
database_name = "naksab-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "00000000000000000000000000000000"

[triggers]
crons = ["*/5 * * * *"]
