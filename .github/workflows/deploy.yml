name: "نشر مِرسال إلى Cloudflare"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "production/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-mirsal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production/package-lock.json

      - name: تثبيت الاعتمادات
        working-directory: production
        run: npm ci --no-audit --no-fund

      # القيم السرية تُحقن من أسرار المستودع — لا تُطبع في أي سجل (GitHub يقنّعها آلياً)
      - name: النشر إلى Cloudflare
        working-directory: production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECEIPT_ENCRYPTION_KEY: ${{ secrets.RECEIPT_ENCRYPTION_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CI: true
        run: ./scripts/deploy.sh
