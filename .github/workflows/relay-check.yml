name: "فحص رابط المرحّل (تشخيص DNS والوصول)"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".cloud/relay-check.flag"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
    steps:
      - uses: actions/checkout@v4

      - name: تشخيص شامل — النطاق الحقيقي، سجل DNS العالمي، والوصول الفعلي
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::لا يوجد رمز Cloudflare في الأسرار"; exit 1; }

          SUBJSON=$(curl -s -m 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          SUB=$(echo "$SUBJSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])" 2>/dev/null || echo "FAILED")
          echo "::notice::النطاق_الفرعي_الحقيقي=$SUB"

          URL="https://oh-relay.$SUB.workers.dev"
          echo "::notice::الرابط_الرسمي=$URL"

          SCRIPTS=$(curl -s -m 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "$SCRIPTS" | grep -q '"id":"oh-relay"' \
            && echo "::notice::العامل_oh-relay=منشور في الحساب" \
            || echo "::warning::العامل_oh-relay=غير موجود في قائمة العمال"

          DNS=$(curl -s -m 20 -H "accept: application/dns-json" \
            "https://cloudflare-dns.com/dns-query?name=oh-relay.$SUB.workers.dev&type=A")
          echo "::notice::DNS_العالمي=$DNS"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$URL/")
          echo "::notice::استجابة_الرابط=HTTP_$CODE"

          echo "— تم الفحص —"
