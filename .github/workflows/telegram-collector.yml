name: "جامع تيليجرام — تغذية الرادار كل 15 دقيقة"
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت GramJS
        run: npm i --no-save telegram@2

      # يحتاج أسراراً: TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION, MIRSAL_TOKEN
      # واختيارياً TELEGRAM_CHANNELS (قائمة مفصولة بفواصل، مثل: @dz_freelance,@jobs_dz)
      - name: جمع الطلبات الجديدة من القنوات
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          MIRSAL_URL: https://mirsal.vitobytestudio.workers.dev
          MIRSAL_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
        run: node radar/telegram-collector.mjs
