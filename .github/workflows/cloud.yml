name: OpenCode - Fixed Permanent Link

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: انشاء الرابط الدائم + ارساله لـ my-vault
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.SERVER_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.AI_KEY }}
        run: |
          sudo apt-get install -y jq -qq
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          nohup opencode web --host 0.0.0.0 --port 3000 > /dev/null 2>&1 &
          sleep 5
          wget -q https://github.[STRIPPED 75 bytes] -O cloudflared
          chmod +x cloudflared

          # انشاء النفق
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          CREATE=$(curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d '{"name":"opencode-vito"}' https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel)
          TUNNEL_ID=$(echo $CREATE | jq -r '.result.id // empty')
          TUNNEL_TOKEN=$(echo $CREATE | jq -r '.result.token // empty')
          if [ -z "$TUNNEL_ID" ]; then
            LIST=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel?name=opencode-vito)
            TUNNEL_ID=$(echo $LIST | jq -r '.result[0].id')
            TOKEN_RESP=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token)
            TUNNEL_TOKEN=$(echo $TOKEN_RESP | jq -r '.result')
          fi

          # الرابط الدائم الحقيقي اللي ما يسقطش
          LINK="https://$TUNNEL_ID.cfargotunnel.com"
          echo "🔗 رابطك الدائم: $LINK"

          # ارسلو لـ my-vault/ACCESS-LINK.md
          rm -rf private
          git clone https://oauth2:$GH_API_TOKEN@github.com/${{ github.repository_owner }}/my-vault.git private
          echo "# 🔗 رابط OpenCode الدائم" > private/ACCESS-LINK.md
          echo "" >> private/ACCESS-LINK.md
          echo "الرابط الدائم: $LINK" >> private/ACCESS-LINK.md
          echo "Username: opencode" >> private/ACCESS-LINK.md
          echo "Password: SERVER_PASS" >> private/ACCESS-LINK.md
          echo "تاريخ: $(date)" >> private/ACCESS-LINK.md
          cd private
          git config user.name "vito-bot"
          git config user.email "bot@vitobytestudio.dev"
          git add ACCESS-LINK.md
          git commit -m "update link $LINK" || true
          git push

          cd ..
          echo "✅ تم الارسال لـ my-vault"
          # شغل النفق
          ./cloudflared tunnel run --token $TUNNEL_TOKEN
