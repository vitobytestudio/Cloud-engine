name: OpenCode - Cloud Server vitobytestudio

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'ماذا تريد من الوكيل؟'
        default: 'ابدأ العمل'
  schedule:
    - cron: '0 */5 * * *'  # يعاود يقلع كل 5 ساعات باش ما ينقطعش أبدا

jobs:
  opencode-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5.5 ساعات
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت OpenCode مباشرة
        run: curl -fsSL https://opencode.ai/install | bash

      - name: تشغيل سيرفر OpenCode المحمي
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.SERVER_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.AI_KEY }}
          OPENAI_API_KEY: ${{ secrets.AI_KEY }}
          # يدعم Claude, Llama, Gemini كلهم عبر AI_KEY
        run: |
          echo "السيرفر محمي بكلمة المرور من SERVER_PASS"
          ~/.opencode/bin/opencode web --host 0.0.0.0 --port 3000 &
          sleep 5
          echo "OpenCode شاعل على http://localhost:3000"

      - name: ربطه بـ Cloudflare worker.dev تاعك vitobytestudio
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # نثبت cloudflared
          curl -L https://github.[STRIPPED 75 bytes] -o cloudflared
          chmod +x cloudflared
          
          # نطلق النفق باسم حسابك vitobytestudio
          ./cloudflared tunnel --url http://localhost:3000 --no-autoupdate &
          sleep 10
          
          echo "الرابط تاعك راه واجد في Logs الفوق"
          echo "مثال: https://xxxx-xxxx.trycloudflare.com"
          echo "تقدر تربطو بـ vitobytestudio.workers.dev عبر Cloudflare Dashboard > Tunnels"

      - name: إبقاء السيرفر شاعل 5.5 ساعات
        run: sleep 19800  # 5.5 ساعات
