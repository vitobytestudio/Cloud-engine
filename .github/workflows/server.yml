name: 🚀 Zero-Buffer OpenCode Cloud (16GB RAM)

on:
  workflow_dispatch:

jobs:
  opencode-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 1. تهيئة قرص الـ RAM فائق السرعة
        run: |
          mkdir -p /dev/shm/secure-ram
          chmod 700 /dev/shm/secure-ram
          sudo sysctl -w net.ipv4.tcp_low_latency=1 > /dev/null 2>&1 || true

      - name: 2. استعادة الكاش والأدوات فورا
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.local
            ~/.config
            ~/.opencode
          key: opencode-nobuffer-v4-${{ runner.os }}

      - name: 3. تثبيت البيئة ومسرع Nginx وفك تشفير الخزنة
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          AI_KEYS: ${{ secrets.AI_KEYS }}
        run: |
          # تثبيت الأدوات مع Nginx لإلغاء تخزين البث المؤقت نهائياً
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx apache2-utils jq gnupg zstd openssl git curl openssh-client > /dev/null
          if ! command -v cloudflared &> /dev/null; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
            sudo chmod +x /usr/local/bin/cloudflared
          fi

          # تثبيت النسخة الرسمية من OpenCode و Wrangler
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          if ! command -v opencode &> /dev/null; then
            curl -fsSL https://opencode.ai/install | bash > /dev/null 2>&1 || npm install -g opencode-ai > /dev/null 2>&1
          fi
          if ! command -v wrangler &> /dev/null; then
            npm install -g wrangler > /dev/null 2>&1
          fi

          # سحب الخزنة (my-vault) وربطها بـ ~/vault
          cd /dev/shm/secure-ram
          git clone --quiet https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/my-vault.git vault
          ln -sfn /dev/shm/secure-ram/vault "$HOME/vault"
          
          cd /dev/shm/secure-ram/vault
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"

          # فك تشفير المشاريع المحفوظة
          if [ -f "vault-data.tar.zst.gpg" ]; then
            echo "$SERVER_PASS" | gpg --batch --yes --passphrase-fd 0 -d vault-data.tar.zst.gpg 2>/dev/null | tar --zstd -xf -
          fi

          # استعادة إعدادات وجلسات OpenCode
          if [ -d "/dev/shm/secure-ram/vault/.opencode-state" ]; then
            mkdir -p ~/.config/opencode ~/.local/share/opencode
            cp -r /dev/shm/secure-ram/vault/.opencode-state/config/* ~/.config/opencode/ 2>/dev/null || true
            cp -r /dev/shm/secure-ram/vault/.opencode-state/share/* ~/.local/share/opencode/ 2>/dev/null || true
          fi

          # حقن جميع المفاتيح
          {
            echo ""
            echo "export CLOUDFLARE_API_TOKEN='${CF_API_TOKEN}'"
            echo "export GITHUB_TOKEN='${GH_TOKEN}'"
            echo "export GH_TOKEN='${GH_TOKEN}'"
            echo 'export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"'
            printf "%s\n" "$AI_KEYS"
          } >> ~/.bashrc

      - name: 4. تشغيل البث الفوري (Zero-Buffering) وفتح البوابة
        env:
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
          AI_KEYS: ${{ secrets.AI_KEYS }}
        run: |
          source ~/.bashrc
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          eval "$AI_KEYS" 2>/dev/null || true

          # إعداد نظام الحفظ الذكي
          cat << 'EOF' > /usr/local/bin/lock-and-save
          #!/usr/bin/env bash
          cd /dev/shm/secure-ram/vault || exit 0
          mkdir -p /dev/shm/secure-ram/vault/.opencode-state/config /dev/shm/secure-ram/vault/.opencode-state/share
          cp -r ~/.config/opencode/* /dev/shm/secure-ram/vault/.opencode-state/config/ 2>/dev/null || true
          cp -r ~/.local/share/opencode/* /dev/shm/secure-ram/vault/.opencode-state/share/ 2>/dev/null || true

          CURRENT_HASH=$(find . -maxdepth 3 -not -path '*/.*' -not -name 'vault-data.tar.zst.gpg' -not -name 'ACCESS-LINK.md' -printf "%p %T@\n" 2>/dev/null | sha256sum | awk '{print $1}')
          LAST_HASH=$(cat /dev/shm/last_sync_hash 2>/dev/null || echo "")

          if [ "$CURRENT_HASH" != "$LAST_HASH" ] || [ "$1" == "force" ]; then
            echo "$CURRENT_HASH" > /dev/shm/last_sync_hash
            tar --zstd -cf - --exclude='vault-data.tar.zst.gpg' --exclude='ACCESS-LINK.md' --exclude='.git' . | \
              gpg --batch --yes --passphrase "$SERVER_PASS" --cipher-algo AES256 -c -o vault-data.tar.zst.gpg 2>/dev/null
            git add vault-data.tar.zst.gpg
            git commit -m "🔒 Smart AES-256 Sync $(date -u +'%Y-%m-%d %H:%M')" --quiet && git push --quiet || true
          fi
          EOF
          sudo chmod +x /usr/local/bin/lock-and-save
          trap "/usr/local/bin/lock-and-save force" EXIT SIGTERM SIGINT
          (while true; do sleep 120; /usr/local/bin/lock-and-save; done) &

          # 1. تشغيل OpenCode داخلياً بدون باسوورد مدمج (لأن Nginx سيتولى الحماية دون قطع البث)
          cd /dev/shm/secure-ram/vault
          unset OPENCODE_SERVER_PASSWORD
          nohup opencode web --port 4096 --hostname 127.0.0.1 > /dev/shm/opencode.log 2>&1 &

          # 2. ضبط Nginx لإلغاء ضغط البيانات وتمرير البث اللحظي (SSE) في نفس اللحظة
          sudo htpasswd -bc /etc/nginx/.htpasswd opencode "$SERVER_PASS" > /dev/null 2>&1
          cat << 'EOF' | sudo tee /etc/nginx/sites-available/default > /dev/null
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }
          server {
              listen 8080 default_server;
              server_name _;

              gzip off;
              proxy_buffering off;
              proxy_request_buffering off;
              proxy_cache off;
              chunked_transfer_encoding on;
              tcp_nodelay on;
              tcp_nopush off;

              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Accept-Encoding "";

              # تمرير قنوات البث الحي فوراً بدون حظر من متصفح الهاتف
              location ~ /(event|global) {
                  auth_basic off;
                  proxy_pass http://127.0.0.1:4096;
                  proxy_read_timeout 24h;
                  add_header Cache-Control "no-cache, no-store, no-transform" always;
                  add_header X-Accel-Buffering "no" always;
              }

              # حماية الواجهة بكلمة المرور
              location / {
                  auth_basic "OpenCode Cloud";
                  auth_basic_user_file /etc/nginx/.htpasswd;
                  proxy_pass http://127.0.0.1:4096;
                  proxy_read_timeout 24h;
                  add_header Cache-Control "no-cache, no-store, no-transform" always;
                  add_header X-Accel-Buffering "no" always;
              }
          }
          EOF
          sudo systemctl restart nginx || sudo nginx -s reload || sudo nginx

          # 3. فتح نفق Cloudflare + نفق SSH مباشر احتياطي
          nohup cloudflared tunnel --protocol http2 --no-autoupdate --url http://127.0.0.1:8080 > /dev/shm/tunnel.log 2>&1 &
          
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q <<< y >/dev/null 2>&1 || true
          nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:127.0.0.1:8080 nokey@localhost.run > /dev/shm/ssh_tunnel.log 2>&1 &

          TUNNEL_URL=""
          for i in {1..20}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /dev/shm/tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 1
          done

          SSH_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.lhr\.life' /dev/shm/ssh_tunnel.log | head -n 1 || echo "جاري التوليد...")

          # إرسال الروابط إلى my-vault
          cd /dev/shm/secure-ram/vault
          cat << EOF > ACCESS-LINK.md
          # ⚡ بوابة OpenCode (تم تفعيل البث اللحظي بدون تحديث الصفحة)
          * **الرابط الأساسي (Cloudflare No-Buffer):** [$TUNNEL_URL]($TUNNEL_URL)
          * **الرابط المباشر الاحتياطي (SSH Direct):** [$SSH_URL]($SSH_URL)
          * **اسم المستخدم:** \`opencode\`
          * **كلمة المرور:** كلمة السر الموضوعة في \`SERVER_PASS\`
          * **المجلد:** \`~/vault/\`
          * **وقت الإقلاع:** $(date -u +'%Y-%m-%d %H:%M UTC')
          EOF
          
          git add ACCESS-LINK.md
          git commit -m "⚡ Fix SSE Real-time Streaming" --quiet && git push --quiet || true

          sleep 20700
          
