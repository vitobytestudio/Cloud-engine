name: "NEXUS — محو كامل للأنظمة القديمة من الإنتاج (أمر المالك)"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexus-purge.yml"

permissions:
  contents: read

concurrency:
  group: nexus-purge
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
    steps:
      - name: حذف العاملين nexus وnexus-hub
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BAD=0
          for W in nexus nexus-hub; do
            CODE=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$W")
            echo "::notice::عامل $W → HTTP $CODE"
            case "$CODE" in 200|404) ;; *) BAD=1; head -c 400 /tmp/out; echo ;; esac
          done
          exit $BAD

      - name: حذف كل قواعد D1 المطابقة
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BAD=0
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100" > /tmp/d1.json
          N=$(jq '[.result[] | select(.name | test("nexus"; "i"))] | length' /tmp/d1.json)
          echo "::notice::قواعد D1 مطابقة: $N"
          for ROW in $(jq -c '.result[] | select(.name | test("nexus"; "i")) | [.uuid, .name]' /tmp/d1.json); do
            ID=$(echo "$ROW" | jq -r '.[0]'); NAME=$(echo "$ROW" | jq -r '.[1]')
            CODE=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database/$ID")
            echo "::notice::D1 $NAME → HTTP $CODE"
            case "$CODE" in 200|404) ;; *) BAD=1; head -c 400 /tmp/out; echo ;; esac
          done
          exit $BAD

      - name: حذف كل مساحات KV المطابقة
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BAD=0
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" > /tmp/kv.json
          N=$(jq '[.result[] | select(.title | test("nexus"; "i"))] | length' /tmp/kv.json)
          echo "::notice::مساحات KV مطابقة: $N"
          for ROW in $(jq -c '.result[] | select(.title | test("nexus"; "i")) | [.id, .title]' /tmp/kv.json); do
            ID=$(echo "$ROW" | jq -r '.[0]'); TITLE=$(echo "$ROW" | jq -r '.[1]')
            CODE=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$ID")
            echo "::notice::KV $TITLE → HTTP $CODE"
            case "$CODE" in 200|404) ;; *) BAD=1; head -c 400 /tmp/out; echo ;; esac
          done
          exit $BAD

      - name: حذف دلاء R2 المطابقة إن وُجدت (مع تفريغها)
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BAD=0
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets?per_page=100" > /tmp/r2.json
          NAMES=$(jq -r '.result.buckets[]? | select(.name | test("nexus"; "i")) | .name' /tmp/r2.json)
          if [ -z "$NAMES" ]; then echo "::notice::لا دلاء R2 مطابقة"; exit 0; fi
          for B in $NAMES; do
            for i in 1 2 3; do
              curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets/$B/objects?per_page=1000" > /tmp/objs.json
              KEYS=$(jq -r '.result.objects[]?.key // .result[]?.key' /tmp/objs.json)
              [ -z "$KEYS" ] && break
              for K in $KEYS; do
                EK=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$K")
                curl -s -o /dev/null -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets/$B/objects?key=$EK"
              done
            done
            CODE=$(curl -s -o /tmp/out -w "%{http_code}" -X DELETE -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets/$B")
            echo "::notice::R2 $B → HTTP $CODE"
            case "$CODE" in 200|404) ;; *) BAD=1; head -c 400 /tmp/out; echo ;; esac
          done
          exit $BAD

      - name: تحقق نهائي — لا أثر في الإنتاج
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          FAIL=0
          for W in nexus nexus-hub; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$W")
            echo "::notice::تحقق عامل $W → HTTP $CODE (404 متوقع)"
            [ "$CODE" = 404 ] || FAIL=1
          done
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100" > /tmp/v1.json
          ND1=$(jq '[.result[] | select(.name | test("nexus"; "i"))] | length' /tmp/v1.json)
          echo "::notice::تحقق D1 → مطابقات باقية: $ND1 (المتوقع 0)"
          [ "$ND1" = 0 ] || FAIL=1
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" > /tmp/v2.json
          NKV=$(jq '[.result[] | select(.title | test("nexus"; "i"))] | length' /tmp/v2.json)
          echo "::notice::تحقق KV → مطابقات باقية: $NKV (المتوقع 0)"
          [ "$NKV" = 0 ] || FAIL=1
          if [ "$FAIL" = 0 ]; then echo "::notice::تم المحو الكامل — لا أثر لأنظمة Nexus القديمة"; else echo "::error::بقايا قائمة — راجع التنبيهات"; fi
          exit $FAIL
