name: "NEXUS B2B — نشر على workers.dev"

on:
  push:
    branches: [main]
    paths: ["nexus-b2b/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تجميع الحزم
        working-directory: nexus-b2b
        run: npm install --no-audit --no-fund

      - name: تجهيز قاعدة D1 ومساحة KV (إنشاء إن لم يوجدا — برمجياً فقط)
        working-directory: nexus-b2b
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          D1_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
            | jq -r '.result[] | select(.name=="nexus_db") | .uuid' | head -1)
          if [ -z "$D1_ID" ]; then
            D1_ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              -d '{"name":"nexus_db"}' | jq -r '.result.uuid')
          fi
          [ -n "$D1_ID" ] && [ "$D1_ID" != "null" ] || { echo "::error::تعذر تجهيز قاعدة D1"; exit 1; }
          KV_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="nexus-cache") | .id' | head -1)
          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" \
              -d '{"title":"nexus-cache"}' | jq -r '.result.id')
          fi
          [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ] || { echo "::error::تعذر تجهيز مساحة KV"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          sed -i "s/00000000000000000000000000000000/$KV_ID/" wrangler.toml
          echo "::notice::D1 وKV جاهزان (المعرفات لا تُطبع في السجلات العامة)"

      - name: المخطط + البيانات التجريبية + تجديد العرض
        working-directory: nexus-b2b
        run: |
          npx wrangler d1 execute DB --remote -y --file schema.sql
          npx wrangler d1 execute DB --remote -y --file seed.sql
          npx wrangler d1 execute DB --remote -y --file refresh.sql

      - name: رمز التمليح (سر المخزن إن وجد وإلا توليد لهذه الجولة — لا يُطبع)
        working-directory: nexus-b2b
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
        run: |
          if [ -n "$AUTH_PEPPER" ]; then
            printf '%s' "$AUTH_PEPPER" | npx wrangler secret put AUTH_PEPPER >/dev/null 2>&1
          else
            openssl rand -hex 32 | npx wrangler secret put AUTH_PEPPER >/dev/null 2>&1
            echo "::warning::AUTH_PEPPER وُلّد لهذه الجولة — أضف سراً باسم AUTH_PEPPER في المخزن لثبات كلمات المرور عبر النشر"
          fi

      - name: النشر على workers.dev
        working-directory: nexus-b2b
        run: |
          npx wrangler deploy
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          echo "NEXUS_URL=https://nexus-b2b.$SUB.workers.dev" >> "$GITHUB_ENV"
          echo "::notice::رابط NEXUS B2B: https://nexus-b2b.$SUB.workers.dev"

      - name: تحقق نهائي عبر الرابط العالمي
        run: |
          sleep 5
          C=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$NEXUS_URL/")
          echo "::notice::استجابة الصفحة=HTTP_$C"
          [ "$C" = "200" ] || { echo "::error::الرابط لا يستجيب"; exit 1; }
          curl -s -m 20 "$NEXUS_URL/api/feed" | head -c 60; echo

      - name: لوحة النشر
        run: |
          {
            echo "## 🚀 NEXUS B2B منشور"
            echo ""
            echo "**الرابط:** $NEXUS_URL"
            echo ""
            echo "- كل دمج يغيّر nexus-b2b/** يعيد النشر تلقائياً — نسخة بنسخة."
            echo "- القاعدة والبيانات التجريبية تُطبَّق تلقائياً (INSERT OR IGNORE — لا تكرار)."
          } >> "$GITHUB_STEP_SUMMARY"
