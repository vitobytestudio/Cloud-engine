name: "NEXUS — نشر على workers.dev"

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تجميع الحزم
        working-directory: nexus
        run: npm install --no-audit --no-fund

      - name: بناء الواجهة (esbuild minify — المصدر في المستودع فقط)
        working-directory: nexus
        run: npm run build

      - name: قاعدة D1 الجديدة (nexus_social_db — تصفير v1.0) ومساحة KV
        working-directory: nexus
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100")
          D1_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="nexus_social_db") | .uuid' | head -1)
          if [ -z "$D1_ID" ]; then
            CR=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              -d '{"name":"nexus_social_db"}')
            D1_ID=$(echo "$CR" | jq -r '.result.uuid // empty')
            echo "::notice::أُنشئت قاعدة nexus_social_db الجديدة (تصفير v1.0 — قاعدة v0.9 القديمة محفوظة ولا تُمس)"
          else
            echo "::notice::قاعدة nexus_social_db قيد الاستخدام"
          fi
          [ -n "$D1_ID" ] || { echo "::error::تعذر تأمين قاعدة nexus_social_db"; exit 1; }
          KR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$KR" | jq -r '.result[] | select(.title=="nexus-cache") | .id' | head -1)
          if [ -z "$KV_ID" ]; then
            CK=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" \
              -d '{"title":"nexus-cache"}')
            KV_ID=$(echo "$CK" | jq -r '.result.id // empty')
          fi
          [ -n "$KV_ID" ] || { echo "::error::تعذر تجهيز مساحة KV"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          sed -i "s/00000000000000000000000000000000/$KV_ID/" wrangler.toml
          echo "::notice::D1 وKV جاهزان"

      - name: المخطط (idempotent — CREATE IF NOT EXISTS)
        working-directory: nexus
        run: |
          npx wrangler d1 execute DB --remote -y --file schema.sql
          echo "::notice::مخطط NEXUS v1.0 مُطبّق"

      - name: النشر
        working-directory: nexus
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$URL" ]; then echo "::notice::LIVE=$URL"
          else
            echo "::error::لم يُستخرج عنوان workers.dev — سجل النشر:"
            tail -n 40 deploy.log | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
            exit 1
          fi

      - name: فحص ما بعد النشر
        working-directory: nexus
        run: |
          URL=$(grep -oE 'https://[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::لا عنوان — فشل النشر"; exit 1; }
          sleep 5
          H=$(curl -s "$URL/api/health")
          echo "health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "::error::فحص /api/health فشل: $H"; exit 1; }
          EX=$(curl -s "$URL/api/explore")
          echo "$EX" | grep -q '"posts"' || { echo "::error::فحص /api/explore فشل: ${EX:0:300}"; exit 1; }
          echo "::notice::NEXUS v1.0 حي على $URL — الاستكشاف يعمل"
