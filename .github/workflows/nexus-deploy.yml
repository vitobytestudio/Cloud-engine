name: "NEXUS — نشر على workers.dev"

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
      WORKERS_URL: https://nexus.vitobytestudio.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تجميع الحزم
        working-directory: nexus
        run: npm ci || npm install --no-audit --no-fund

      - name: بناء الواجهة (esbuild minify — المصدر في المستودع فقط)
        working-directory: nexus
        run: npm run build

      - name: قاعدة NEXUS ومساحة KV (إنشاء برمجي إن لم توجدا)
        working-directory: nexus
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          RESP=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100")
          D1_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="nexus_db") | .uuid' | head -1)
          if [ -z "$D1_ID" ]; then
            CR=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              -d '{"name":"nexus_db"}')
            D1_ID=$(echo "$CR" | jq -r '.result.uuid // empty')
            echo "::notice::أُنشئت قاعدة nexus_db الجديدة (نواة المنصة الجديدة)"
          else
            echo "::notice::قاعدة nexus_db قيد الاستخدام"
          fi
          [ -n "$D1_ID" ] || { echo "::error::تعذر تأمين قاعدة nexus_db"; exit 1; }
          KR=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$KR" | jq -r '.result[] | select(.title=="nexus-cache") | .id' | head -1)
          if [ -z "$KV_ID" ]; then
            CK=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" \
              -d '{"title":"nexus-cache"}')
            KV_ID=$(echo "$CK" | jq -r '.result.id // empty')
          fi
          [ -n "$KV_ID" ] || { echo "::error::تعذر تجهيز مساحة KV"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          sed -i "s/00000000000000000000000000000000/$KV_ID/" wrangler.toml
          echo "::notice::D1 وKV جاهزان"

      - name: المخطط (idempotent — CREATE IF NOT EXISTS)
        working-directory: nexus
        run: |
          npx wrangler d1 execute DB --remote -y --file schema.sql
          echo "::notice::مخطط NEXUS مُطبّق"

      - name: النشر
        working-directory: nexus
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee deploy.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -eq 0 ]; then echo "::notice::LIVE=$WORKERS_URL"; exit 0; fi
          echo "::error::فشل النشر (rc=$RC) — نهاية سجل النشر:"
          grep -aE "ERROR|✘|failed" deploy.log | tail -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          tail -n 30 deploy.log | grep -av '^\s*$' | tail -n 9 | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
          exit 1

      - name: فحص ما بعد النشر
        working-directory: nexus
        run: |
          URL="$WORKERS_URL"
          sleep 5
          H=$(curl -s "$URL/api/health")
          echo "health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "::error::فحص /api/health فشل: $H"; exit 1; }
          FD=$(curl -s "$URL/api/feed")
          echo "feed: $FD"
          echo "$FD" | grep -q '"posts"' || { echo "::error::فحص /api/feed فشل: ${FD:0:300}"; exit 1; }
          DZ=$(curl -s -o /dev/null -w "%{http_code}" "$URL/data/dz.json")
          echo "dz.json: $DZ"
          [ "$DZ" = 200 ] || { echo "::error::داتا الولايات غير مخدومة"; exit 1; }
          echo "::notice::NEXUS حي على $URL — الفيد والولايات يعملان"
