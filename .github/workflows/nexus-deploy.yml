name: "NEXUS B2B — نشر على workers.dev"

on:
  push:
    branches: [main]
    paths:
      - "nexus-b2b/**"
      - ".github/workflows/nexus-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تجميع الحزم
        working-directory: nexus-b2b
        run: npm install --no-audit --no-fund

      - name: تجهيز قاعدة D1 ومساحة KV (إنشاء إن لم يوجدا — برمجياً فقط)
        working-directory: nexus-b2b
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100")
          OKF=$(echo "$RESP" | jq -r '.success')
          [ "$OKF" = "True" ] || [ "$OKF" = "true" ] || echo "::warning::D1-list: $(echo "$RESP" | jq -c '.errors')"
          # المرحلة الحية: نستخدم nexus_db القائمة — بيانات المستخدمين الحقيقيين لا تُمس أبداً
          D1_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="nexus_db") | .uuid' | head -1)
          if [ -z "$D1_ID" ]; then
            CR=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              -d '{"name":"nexus_db"}')
            D1_ID=$(echo "$CR" | jq -r '.result.uuid // empty')
            echo "::notice::أُنشئت قاعدة nexus_db لأول مرة"
          else
            echo "::notice::nexus_db القائمة قيد الاستخدام — حسابات المستخدمين محفوظة"
          fi
          [ -n "$D1_ID" ] || { echo "::error::تعذر تأمين قاعدة nexus_db"; exit 1; }
          KR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$KR" | jq -r '.result[] | select(.title=="nexus-cache") | .id' | head -1)
          if [ -z "$KV_ID" ]; then
            CK=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" \
              -d '{"title":"nexus-cache"}')
            KV_ID=$(echo "$CK" | jq -r '.result.id // empty')
            [ -n "$KV_ID" ] || echo "::warning::KV-create: $(echo "$CK" | jq -c '.errors')"
          fi
          [ -n "$KV_ID" ] || { echo "::error::تعذر تجهيز مساحة KV"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          sed -i "s/00000000000000000000000000000000/$KV_ID/" wrangler.toml
          echo "::notice::D1 وKV جاهزان"

      - name: المخطط + البيانات التجريبية + تجديد العرض
        working-directory: nexus-b2b
        run: |
          npx wrangler d1 execute DB --remote -y --file schema.sql
          npx wrangler d1 execute DB --remote -y --file seed.sql
          npx wrangler d1 execute DB --remote -y --file refresh.sql

      - name: رمز التمليح (سر المخزن إن وجد وإلا توليد لهذه الجولة — لا يُطبع)
        working-directory: nexus-b2b
        env:
          AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
        run: |
          if [ -n "$AUTH_PEPPER" ]; then
            printf '%s' "$AUTH_PEPPER" | npx wrangler secret put AUTH_PEPPER >/dev/null 2>&1
          else
            # التمليح الدائم: يُنشأ مرة واحدة ويُخزَّن في KV — كلمات المرور لا تنكسر بين النشرات (لا يُطبع أبداً)
            PEPPER=$(npx wrangler kv key get "auth_pepper" --binding CACHE_KV --remote 2>/dev/null || true)
            if [ -z "$PEPPER" ]; then
              PEPPER=$(openssl rand -hex 32)
              printf '%s' "$PEPPER" | npx wrangler kv key put "auth_pepper" --binding CACHE_KV --remote >/dev/null 2>&1
              echo "::notice::أُنشئ رمز تمليح دائم وخُزِّن في KV"
            else
              echo "::notice::رمز التمليح الدائم جُلب من KV — ثابت عبر النشرات"
            fi
            printf '%s' "$PEPPER" | npx wrangler secret put AUTH_PEPPER >/dev/null 2>&1
          fi

      - name: النشر على workers.dev
        working-directory: nexus-b2b
        run: |
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log || { echo "::warning::wrangler: $(tail -8 /tmp/deploy.log | tr '\n' ' · ')"; exit 1; }
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          echo "NEXUS_URL=https://nexus.$SUB.workers.dev" >> "$GITHUB_ENV"
          echo "::notice::رابط NEXUS B2B: https://nexus.$SUB.workers.dev"
          OLDW=$(curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nexus-b2b")
          echo "::notice::العامل القديم nexus-b2b: $(echo "$OLDW" | jq -r 'if .success then "حُذف" else (.errors[0].message // "غير موجود") end')"

      - name: تحقق نهائي عبر الرابط العالمي
        run: |
          sleep 5
          C=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$NEXUS_URL/")
          echo "::notice::استجابة الصفحة=HTTP_$C"
          [ "$C" = "200" ] || { echo "::error::الرابط لا يستجيب"; exit 1; }
          curl -s -m 20 "$NEXUS_URL/api/feed" | head -c 60; echo

      - name: تشخيص النطاق + جرد الدومينات + ربط تلقائي إن وجد دومين نشط وحيد
        run: |
          ZR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50&account.id=$CLOUDFLARE_ACCOUNT_ID")
          if [ "$(echo "$ZR" | jq -r '.success')" != "true" ]; then
            echo "::warning::zones-list: $(echo "$ZR" | jq -c '.errors')"
          else
            ACT=$(echo "$ZR" | jq -r '[.result[] | select(.status=="active")] | length')
            echo "::notice::دومينات نشطة على الحساب: $ACT"
            echo "$ZR" | jq -r '.result[] | "دومين: \(.name) — \(.status)"' | while read -r L; do echo "::notice::$L"; done
            if [ "$ACT" = "1" ]; then
              ZN=$(echo "$ZR" | jq -r '[.result[] | select(.status=="active")][0].name')
              ZID=$(echo "$ZR" | jq -r '[.result[] | select(.status=="active")][0].id')
              AT=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
                -d "{\"zone_id\":\"$ZID\",\"hostname\":\"nexus.$ZN\",\"service\":\"nexus-b2b\",\"environment\":\"production\"}")
              echo "::notice::ربط nexus.$ZN: $(echo "$AT" | jq -c 'if .success then "نجح" else .errors end')"
              sleep 8
              CC=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://nexus.$ZN/")
              echo "::notice::استجابة الدومين الخاص=HTTP_$CC"
            fi
          fi
          DR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
          echo "$DR" | jq -r '.result[]? | "نطاق مرتبط: \(.hostname) → \(.service)"' | while read -r L; do echo "::notice::$L"; done

      - name: لوحة النشر
        run: |
          {
            echo "## 🚀 NEXUS B2B منشور"
            echo ""
            echo "**الرابط:** $NEXUS_URL"
            echo ""
            echo "- كل دمج يغيّر nexus-b2b/** يعيد النشر تلقائياً — نسخة بنسخة."
            echo "- القاعدة والبيانات التجريبية تُطبَّق تلقائياً (INSERT OR IGNORE — لا تكرار)."
          } >> "$GITHUB_STEP_SUMMARY"
