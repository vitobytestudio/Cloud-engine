name: "NEXUS — نشر على workers.dev"

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-deploy.yml"
  workflow_dispatch:
    inputs:
      setup_window_minutes:
        description: "دقائق فتح نافذة /setup للإعداد لمرة واحدة (0 = مغلقة)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: nexus-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c963e813a0e1a05274746e27c054d782
      WORKERS_URL: https://nexus.vitobytestudio.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تجميع الحزم
        working-directory: nexus
        run: npm ci || npm install --no-audit --no-fund

      - name: بناء الواجهة (esbuild minify — المصدر في المستودع فقط)
        working-directory: nexus
        run: npm run build

      - name: البوابة الحية — هارنس API ×2 + هارنس DOM متصفح محاكى
        working-directory: nexus
        run: |
          npx wrangler d1 execute DB --local -y --file schema.sql >/dev/null
          npx wrangler d1 execute DB --local -y --file seed.sql >/dev/null
          npx wrangler dev --port 8792 --local --var "ADMIN_SETUP_TOKEN:ci-drill-token" > dev.log 2>&1 &
          WPID=$!
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8792/api/health && break; sleep 2; done
          curl -s http://127.0.0.1:8792/api/health | grep -q '"ok":true' || { echo "::error::الخادم المحلي لم يقلع"; tail -n 20 dev.log; exit 1; }
          node tests/parser.dev.mjs
          node tests/fleet.dev.mjs
          node tests/harness.dev.mjs
          node tests/harness.dev.mjs
          node tests/dom.dev.mjs
          node tests/attack.dev.mjs
          node tests/visual.dev.mjs
          kill $WPID 2>/dev/null || true

      - name: بوابة نافذة الإعداد (فتح مؤقت/توكن موازٍ/انقضاء ذاتي)
        working-directory: nexus
        run: npm run gate:window

      - name: بوابة التشويش العدواني (صفر 5xx + سباق تزامن الوحدات)
        working-directory: nexus
        run: npm run gate:fuzz

      - name: تدقيق الاعتماديات (أمني — الحرجة تسقط البناء)
        working-directory: nexus
        run: |
          npm audit --omit=dev --audit-level=critical || {
            echo "::error::ثغرات حرجة في الاعتماديات — رفع الحزم إلزامي قبل الدمج"; exit 1; }
          echo "::notice::لا ثغرات حرجة في اعتماديات الإنتاج"

      - name: المراجع العقلي الثاني (كل مفتاح reviewer= في AI_KEYS يحكم باستقلال — BLOCK يُسقط البناء)
        working-directory: .
        run: node .github/scripts/ai-review.mjs
        env:
          AI_KEYS: ${{ secrets.AI_KEYS }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || '' }}

      - name: حفر المراجع — ثغرات مزروعة عمداً والرفض إلزامي (المرحلة 1 حتمية، والمرحلة 2 حية بمفتاح المالك)
        working-directory: nexus
        run: npm run reviewer-drill

      - name: قاعدة NEXUS ومساحة KV (إنشاء برمجي إن لم توجدا)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          RESP=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?per_page=100")
          D1_ID=$(echo "$RESP" | jq -r '.result[] | select(.name=="nexus_db") | .uuid' | head -1)
          if [ -z "$D1_ID" ]; then
            CR=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database" \
              -d '{"name":"nexus_db"}')
            D1_ID=$(echo "$CR" | jq -r '.result.uuid // empty')
            echo "::notice::أُنشئت قاعدة nexus_db الجديدة (نواة المنصة الجديدة)"
          else
            echo "::notice::قاعدة nexus_db قيد الاستخدام"
          fi
          [ -n "$D1_ID" ] || { echo "::error::تعذر تأمين قاعدة nexus_db"; exit 1; }
          KR=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$KR" | jq -r '.result[] | select(.title=="nexus-cache") | .id' | head -1)
          if [ -z "$KV_ID" ]; then
            CK=$(curl -s -X POST -H "$AUTH" -H "content-type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" \
              -d '{"title":"nexus-cache"}')
            KV_ID=$(echo "$CK" | jq -r '.result.id // empty')
          fi
          [ -n "$KV_ID" ] || { echo "::error::تعذر تجهيز مساحة KV"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.toml
          sed -i "s/00000000000000000000000000000000/$KV_ID/" wrangler.toml
          echo "::notice::D1 وKV جاهزان"

      - name: تصفير إدارة NEXUS (فقط عند وسم [reset-admin] في رسالة دمج الالتزام النهائية — بأمر المالك)
        if: ${{ contains(github.event.head_commit.message, '[reset-admin]') }}
        working-directory: nexus
        run: |
          npx wrangler d1 execute DB --remote -y --command "DELETE FROM admin_devices" >/dev/null 2>&1 || true
          npx wrangler d1 execute DB --remote -y --command "DELETE FROM admins" >/dev/null 2>&1 || true
          npx wrangler d1 execute DB --remote -y --command "DELETE FROM admin_meta WHERE k IN ('setup_done','panel_hash')" >/dev/null 2>&1 || true
          echo "::warning::أُصفّرت إدارة NEXUS وروابط اللوحة — المالك يعيد الإعداد مرة واحدة من /setup"

      - name: المخطط والترقية والبذرة (idempotent)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
          sed -i 's/ENVIRONMENT = "development"/ENVIRONMENT = "production"/' wrangler.toml
          npx wrangler d1 execute DB --remote -y --file schema.sql
          npx wrangler d1 execute DB --remote -y --file migrate.sql || echo "::notice::أعمدة الترقية مطبقة مسبقاً"
          npx wrangler d1 execute DB --remote -y --file seed.sql
          echo "::notice::مخطط NEXUS وترقيته وبذرة العرض مُطبّقة"

      - name: مفتاح أسطول الذكاء الاصطناعي (سر — إن وُجد)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
          if [ -n "$AI_KEYS" ]; then
            echo "$AI_KEYS" | npx wrangler secret put AI_KEYS
            echo "::notice::AI_KEYS الطول=${#AI_KEYS} | بصمات البادئات: $(echo "$AI_KEYS" | grep -oE 'AIza|gsk_|sk-or-v1-|sk-ant|sk-' | sort | uniq -c | tr '\n' ' ' || echo 'لا شيء')"
            echo "::notice::AI_KEYS نُقل كسر للعامل"
          else
            echo "::warning::AI_KEYS غير مضبوط في أسرار GitHub — الوكيل يعمل بلا أسطول حتى إضافته"
          fi
        env:
          AI_KEYS: ${{ secrets.AI_KEYS }}

      - name: توكن رابط إعداد NEXUS السري (سر — إن وُجد؛ بدونه الإعداد مغلق تماماً)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
          if [ -n "$ADMIN_SETUP_TOKEN" ]; then
            echo "$ADMIN_SETUP_TOKEN" | npx wrangler secret put ADMIN_SETUP_TOKEN
            echo "::notice::ADMIN_SETUP_TOKEN نُقل كسر للعامل — رابط الإعداد: $WORKERS_URL/setup/<التوكن> (لا يُطبع التوكن أبداً)"
          else
            echo "::warning::ADMIN_SETUP_TOKEN غير مضبوط في أسرار GitHub — الإعداد مغلق تماماً على NEXUS حتى يضبطه المالك"
          fi
        env:
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}

      - name: النشر
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
        env:
          SETUP_WINDOW_MINUTES: ${{ github.event.inputs.setup_window_minutes || '0' }}
          set +e
          SETUP_END=$(( $(date +%s) * 1000 + ${SETUP_WINDOW_MINUTES:-0} * 60000 ))
          echo "::notice::نافذة الإعداد: ${SETUP_WINDOW_MINUTES:-0} دقيقة (0 = مغلقة — كل نشر افتراضي يغلقها)"
          npx wrangler deploy --var "ADMIN_SETUP_WINDOW_END:$SETUP_END" 2>&1 | tee deploy.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -eq 0 ]; then echo "::notice::LIVE=$WORKERS_URL"; exit 0; fi
          echo "::error::فشل النشر (rc=$RC) — نهاية سجل النشر:"
          grep -aE "ERROR|✘|failed" deploy.log | tail -n 8 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          tail -n 30 deploy.log | grep -av '^\s*$' | tail -n 9 | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
          exit 1

      - name: فحص ما بعد النشر
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: nexus
        run: |
          URL="$WORKERS_URL"
          sleep 5
          H=$(curl -s "$URL/api/health")
          echo "health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "::error::فحص /api/health فشل: $H"; exit 1; }
          FD=$(curl -s "$URL/api/feed")
          echo "feed: $FD"
          echo "$FD" | grep -q '"posts"' || { echo "::error::فحص /api/feed فشل: ${FD:0:300}"; exit 1; }
          DZ=$(curl -s -o /dev/null -w "%{http_code}" "$URL/data/dz.json")
          echo "dz.json: $DZ"
          [ "$DZ" = 200 ] || { echo "::error::داتا الولايات غير مخدومة"; exit 1; }
          CF=$(curl -s "$URL/api/store/vito-store/agent")
          echo "::notice::fleet-counts=$(echo "$CF" | jq -c '.fleet // "{}"')"
          AG=$(curl -s -X POST "$URL/api/agent/chat" -H "content-type: application/json" \
            -d '{"store_slug":"vito-store","message":"شحال الساعة؟","lang":"ar","buyer":"ci-smoke"}')
          echo "::notice::agent-reply=${AG:0:300}"
          echo "$AG" | grep -q '"reply"' && echo "::notice::الوكيل الذكي حي ويرد فعلاً من الأسطول" || echo "::warning::الوكيل بلا رد — راجع fleet-config أعلاه (عدّادات الأسطول أو الرد السببي)"
          echo "::notice::NEXUS حي على $URL — الفيد والولايات يعملان"
