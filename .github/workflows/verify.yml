name: "فحص حيوية مِرسال المنتج"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/verify.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فحص الصحة والباقات والواجهة
        run: |
          H=$(curl -s -m 15 https://mirsal.vitobytestudio.workers.dev/api/health)
          echo "::notice::health: $H"
          P=$(curl -s -m 15 https://mirsal.vitobytestudio.workers.dev/api/plans | head -c 200)
          echo "::notice::plans: $P"
          S=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://mirsal.vitobytestudio.workers.dev/)
          echo "::notice::landing: HTTP $S"
          F=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://mirsal.vitobytestudio.workers.dev/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2)
          echo "::notice::الخط العربي: HTTP $F"
          CS=$(curl -s -m 15 https://mirsal.vitobytestudio.workers.dev/styles.css | grep -c "IBM Plex Sans Arabic" || true)
          echo "::notice::نظام التصميم الجديد: $CS إشارة للخط"
          R=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://mirsal.vitobytestudio.workers.dev/api/clients)
          echo "::notice::حماية الجلسة (401 متوقع): HTTP $R"
