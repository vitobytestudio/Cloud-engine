name: "اختبار الرادار الحقيقي حياً"
on:
  push:
    branches: [main]
    paths: [".github/workflows/radar-live.yml"]
permissions:
  contents: read
concurrency:
  group: radar-live
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: انتظار النسخة الجديدة
        run: |
          API=https://mirsal.vitobytestudio.workers.dev
          for i in $(seq 1 24); do
            V=$(curl -s -m 10 $API/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('v',''))" || true)
            [ "$V" = "2.1.0" ] && { echo "النسخة الجديدة حية"; break; }
            echo "انتظار النشر... ($i)"; sleep 10
          done
      - name: تسجيل مستخدم جديد وتشغيل مسح حقيقي
        run: |
          API=https://mirsal.vitobytestudio.workers.dev
          STAMP=$RANDOM
          curl -s -c /tmp/c.jar -X POST $API/api/auth/register -H 'Content-Type: application/json' \
            -d "{\"name\":\"فاحص الرادار\",\"email\":\"radar-live-$STAMP@test.dz\",\"password\":\"Passw0rd!2026\",\"consent\":true}" > /dev/null
          curl -s -b /tmp/c.jar -c /tmp/c.jar -X POST $API/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"radar-live-$STAMP@test.dz\",\"password\":\"Passw0rd!2026\"}" > /dev/null
          CSRF=$(grep mirsal_csrf /tmp/c.jar | awk '{print $NF}')
          curl -s -b /tmp/c.jar -X PUT $API/api/profile -H "X-CSRF: $CSRF" -H 'Content-Type: application/json' \
            -d '{"profession_id":"dev_web","keywords":[],"wilayas":["كل الولايات"]}' > /dev/null
          echo "المسح الحقيقي جارٍ..."
          SCAN=$(curl -s -m 120 -b /tmp/c.jar -X POST $API/api/radar/scan -H "X-CSRF: $CSRF" -H 'Content-Type: application/json' -d '{}')
          echo "نتيجة المسح: $SCAN"
          FETCHED=$(echo "$SCAN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('fetched',0))")
          MATCHED=$(echo "$SCAN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('matched',0))")
          INSERTED=$(echo "$SCAN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('inserted',0))")
          echo "::notice::جُلبت $FETCHED نتيجة خام من القنوات — طابقت $MATCHED — أُضيف $INSERTED"
          CL=$(curl -s -b /tmp/c.jar $API/api/clients | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('clients',[])), d.get('quota',{}))")
          echo "::notice::اللوحة تسلّم الآن: $CL"
          [ "$FETCHED" -gt 0 ] && echo "::notice::✅ الرادار يبحث فعلاً في الإنترنت" || { echo "::error::الرادار لم يجلب شيئاً"; exit 1; }
