name: "OpenHands — وكيل مهام (بلا واجهة، النتيجة Pull Request)"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "المهمة المطلوبة من الوكيل (بالعربية أو الإنجليزية)"
        required: true
        type: string
      max_iterations:
        description: "أقصى عدد دورات للوكيل"
        required: false
        default: "40"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openhands-task
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت OpenHands
        run: |
          python -m pip install --upgrade pip -q
          pip install -q "e2b==0.17.2a40"
          pip install -q openhands-ai
          pip install -q "fastapi==0.115.12"

      - name: تنفيذ المهمة بالوكيل
        env:
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          LLM_MODEL: "gemini/gemini-2.0-flash"
          WORKSPACE_BASE: ${{ github.workspace }}
          RUN_AS_OPENHANDS: "false"
          RUNTIME: "local"
          FILE_STORE: "local"
          FILE_STORE_PATH: ${{ github.workspace }}/.files
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::أضف سراً باسم OPENHANDS_LLM_API_KEY (مفتاح Gemini المجاني يكفي)"
            exit 1
          fi
          python - << 'PY'
          import asyncio, sys
          sys.argv = ["openhands", "-t", r"""${{ inputs.task }}""", "-i", "${{ inputs.max_iterations }}"]
          from openhands.core.cli import main
          asyncio.run(main())
          PY

      - name: فتح Pull Request بالنتيجة
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::الوكيل لم يُجرِ تغييرات على الملفات (قد تكون المهمة استشارية)"
            git log --oneline -1
            exit 0
          fi
          BR="openhands/task-$(date +%s)"
          git config user.name "openhands-bot"
          git config user.email "openhands-bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "OpenHands: ${{ inputs.task }}" --no-verify || exit 0
          git push origin "$BR"
          gh pr create --fill --title "OpenHands: ${{ inputs.task }}" \
            --body "مهمة نفّذها وكيل OpenHands آلياً — راجع قبل الدمج." --head "$BR"
          echo "::notice::تم فتح Pull Request بالنتيجة"
